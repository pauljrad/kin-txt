<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>KiN-TXT Motion Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#eee;font:12px system-ui;display:grid;place-items:center;min-height:100dvh}canvas{display:block;width:min(100vw,56.25dvh);height:auto;aspect-ratio:9/16}nav{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));right:12px;display:flex;gap:8px;opacity:.65}button{background:#222;color:#fff;border:1px solid #555;border-radius:20px;padding:9px 14px}body.clean nav{display:none}</style></head><body><canvas id="c" width="1080" height="1920" aria-label="Animated KiN-TXT editorial poster"></canvas><nav><button id="pause">Pause</button><button id="restart">Replay</button><button id="hide">Clean view</button></nav><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),T=12;let start=performance.now(),hold=0,paused=false;
const ink='#e9e6db',accent='#c8d34d';function ease(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)}function line(x,y,x2,y2,color=ink,w=2){g.strokeStyle=color;g.lineWidth=w;g.beginPath();g.moveTo(x,y);g.lineTo(x2,y2);g.stroke()}function circle(x,y,r,color){g.fillStyle=color;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}function txt(s,x,y,size,color=ink,weight=400){g.fillStyle=color;g.font=weight+' '+size+'px Arial, sans-serif';g.fillText(s,x,y)}
function draw(t){let p=t/T,a=p*Math.PI*2;g.fillStyle='#090909';g.fillRect(0,0,1080,1920);let fade=ease(t/.6)*ease((T-t)/.8);g.globalAlpha=fade;txt('KiN–TXT',76,112,32,ink,600);txt('MOTION STUDIES / 001',76,157,21,'#777');line(76,190,1004,190,'#444');g.save();g.translate(540,700);g.rotate(.24*Math.sin(a));for(let i=0;i<7;i++){let q=a+i*.48;g.save();g.rotate(i*.23+a*.14);g.strokeStyle=i===3?accent:ink;g.lineWidth=i===3?7:2;g.beginPath();g.ellipse(0,0,110+i*43,320-i*22,0,0,Math.PI*2);g.stroke();g.restore();}circle(230*Math.cos(a),230*Math.sin(a),24,accent);circle(-170*Math.sin(a),180*Math.cos(a),10,ink);g.restore();line(76,1110,1004,1110,'#444');let lines=t<4?['Not everything','needs to move','faster.']:t<8?['A little','less noise.']:['Find your','reading rhythm.'];let local=t%4;g.globalAlpha=fade*ease(local/.45)*ease((4-local)/.35);lines.forEach((s,i)=>txt(s,76,1260+i*112,100,ink,600));g.globalAlpha=fade;txt('LITERATURE / RHYTHM / ATTENTION',76,1710,23,'#888');txt('kin-txt.com',76,1790,38,ink,400);line(76,1840,1004,1840,'#444');line(76,1840,76+928*p,1840,accent,4);g.globalAlpha=1}
function frame(now){draw(((paused?hold:now-start)/1000)%T);requestAnimationFrame(frame)}requestAnimationFrame(frame);document.querySelector('#pause').onclick=e=>{if(paused){start=performance.now()-hold;paused=false}else{hold=performance.now()-start;paused=true}e.target.textContent=paused?'Play':'Pause'};document.querySelector('#restart').onclick=()=>{start=performance.now();hold=0};document.querySelector('#hide').onclick=()=>document.body.classList.add('clean');c.onclick=()=>document.body.classList.remove('clean');
</script></body></html>
