<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Back into a book · KiN-TXT</title><style>:root{color-scheme:dark;font:18px/1.6 system-ui;color:#efe9d9;background:#0d2026}body{margin:0}main{max-width:44rem;margin:auto;padding:clamp(1.4rem,6vw,5rem)}small{color:#adc7bb;letter-spacing:.14em;text-transform:uppercase}h1{font:normal clamp(3rem,9vw,6rem)/1 Georgia;margin:.35em 0}article{padding:1em 0;min-height:5em;font:clamp(1.6rem,5vw,2.8rem)/1.35 Georgia}em,a{color:#f8c67f}button,select{background:#19353a;color:inherit;border:1px solid #73928c;border-radius:.35em;padding:.6em .8em;font:inherit;margin:.2em}button{cursor:pointer}details,footer{margin-top:2em}label{display:block;margin:.8em 0}input{width:1.2em;height:1.2em;vertical-align:middle}a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid white}</style><main><small>KiN-TXT · A seven-evening reading challenge</small><h1>Back into a book</h1><p>One book. Ten minutes. Seven evenings, with room to miss a night. Pick any book, in any edition. You don’t have to finish it.</p><p>Need a book? <a href="https://kin-txt.com/home?book=treasure-island">Try Treasure Island</a>.</p><label><input type="checkbox" data-day="0"> <b>Evening 1.</b> Choose a book you once put down. Give it ten minutes from wherever you like.</label><label><input type="checkbox" data-day="1"> <b>Evening 2.</b> Go back one paragraph before carrying on. See what comes back to you.</label><label><input type="checkbox" data-day="2"> <b>Evening 3.</b> Find a sentence you’d recognise even without the author’s name.</label><label><input type="checkbox" data-day="3"> <b>Evening 4.</b> Read a little dialogue aloud. Where does your voice slow down?</label><label><input type="checkbox" data-day="4"> <b>Evening 5.</b> Follow one small detail: a sound, a colour, something on a table.</label><label><input type="checkbox" data-day="5"> <b>Evening 6.</b> Read until you find a line you want to keep. Jot it down if you like.</label><label><input type="checkbox" data-day="6"> <b>Evening 7.</b> Give the book ten more minutes. Leave a bookmark where you’d like to return.</label><small id="note">Your ticks stay in this browser.</small><script>for(const box of document.querySelectorAll('input')){let k='kin-seven-v1-'+box.dataset.day;try{box.checked=localStorage.getItem(k)==='1'}catch{}box.onchange=()=>{try{localStorage.setItem(k,box.checked?'1':'0')}catch{document.getElementById('note').textContent='Progress cannot be saved in this browser.'}}}</script></main></html>
