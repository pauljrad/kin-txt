name: One-time mobile Creator layout patch

on:
  push:
    branches:
      - fix/creator-home-mobile

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/creator-home-mobile
          fetch-depth: 0
      - name: Apply layout patch
        run: python3 scripts/one_time_mobile_layout_fix.py
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Tidy Creator home layout on mobile"
          git push origin HEAD:fix/creator-home-mobile
