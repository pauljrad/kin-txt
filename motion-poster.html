<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>KiN-TXT Motion Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#eee;font:12px system-ui;display:grid;place-items:center;min-height:100dvh}canvas{display:block;width:min(100vw,56.25dvh);height:auto;aspect-ratio:9/16}.stage{position:relative;width:min(100vw,56.25dvh)}.stage canvas{width:100%}#reader{position:absolute;container-type:size;transform:translateZ(0);overflow:hidden;left:6.48%;top:11.98%;width:87.04%;height:50%;border:0;background:#000;visibility:hidden;pointer-events:none}nav{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));right:12px;display:flex;gap:8px;opacity:.65}button{background:#222;color:#fff;border:1px solid #555;border-radius:20px;padding:9px 14px}body.clean nav{display:none}</style></head><body><div class="stage"><canvas id="c" width="1080" height="1920" aria-label="Animated KiN-TXT editorial poster"></canvas><div id="reader"></div></div><nav><button id="pause">Pause</button><button id="restart">Replay</button><button id="hide">Clean view</button></nav><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),T=22;let start=performance.now(),hold=0,paused=false;
const ink='#e9e6db',accent='#c8d34d';function ease(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)}function line(x,y,x2,y2,color=ink,w=2){g.strokeStyle=color;g.lineWidth=w;g.beginPath();g.moveTo(x,y);g.lineTo(x2,y2);g.stroke()}function circle(x,y,r,color){g.fillStyle=color;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}function txt(s,x,y,size,color=ink,weight=400){g.fillStyle=color;g.font=weight+' '+size+'px Arial, sans-serif';g.fillText(s,x,y)}
function draw(t){const W=1080,H=1920,beat=t*2.5,k=Math.floor(beat),f=beat-k,scene=Math.floor(t/3),u=t%3,inv=(scene%2===1),bg=inv?'#fff':'#000',fg=inv?'#000':'#fff';g.globalAlpha=1;g.fillStyle=bg;g.fillRect(0,0,W,H);g.save();g.beginPath();g.rect(70,230,940,960);g.clip();g.translate(540,710);g.strokeStyle=fg;g.fillStyle=fg;let phase=beat*Math.PI/2; if(scene===0){for(let i=0;i<24;i++){g.save();g.rotate(i*Math.PI/12+phase*.12);let d=130+90*Math.sin(phase+i*.31);g.fillRect(d,-9,210+100*Math.sin(i*.8+phase),18);g.restore()}g.globalCompositeOperation='difference';g.fillStyle='#fff';g.beginPath();g.arc(0,0,210+40*Math.sin(phase),0,Math.PI*2);g.fill();g.globalCompositeOperation='source-over'}else if(scene===4){let z=ease((t-2)/.8);for(let i=0;i<16;i++){g.save();g.rotate(i*Math.PI/8+z*Math.PI/2);g.fillRect(35+z*220,-12,180,24);g.restore()}g.globalCompositeOperation='difference';g.fillStyle='#fff';g.beginPath();g.arc(0,0,40+z*270,0,Math.PI*2);g.fill();g.globalCompositeOperation='source-over'}else if(scene===1){g.scale(.68,.68);for(let j=-6;j<=6;j++){for(let i=-5;i<=5;i++){let x=i*125,y=j*108;g.save();g.translate(x,y);g.rotate(phase*.5+(i+j)*.38);g.fillRect(-42,-7,84,14);g.fillRect(-7,-42,14,84);g.restore()}}g.globalCompositeOperation='difference';g.fillStyle='#fff';g.fillRect(-675,-100+220*Math.sin(phase),1350,200);g.globalCompositeOperation='source-over'}else if(scene===2){for(let i=0;i<18;i++){g.save();g.rotate(i*.17+phase*.16);g.lineWidth=3+i%4;g.strokeRect(-110-i*17,-110-i*17,220+i*34,220+i*34);g.restore()}for(let i=0;i<5;i++){let q=phase+i*1.256;circle(300*Math.cos(q),300*Math.sin(q),18,fg)}}else{for(let i=0;i<28;i++){let y=-490+i*35;let x=180*Math.sin(i*.29+phase);g.fillRect(-420+x,y,840-2*Math.abs(x),i%3===0?22:7)}g.globalCompositeOperation='difference';g.fillStyle='#fff';g.beginPath();g.arc(0,0,250,0,Math.PI*2);g.fill();g.globalCompositeOperation='source-over'}g.restore();txt('KiN-TXT',70,105,38,fg,700);txt('STUDIES IN ATTENTION',70,155,23,fg,400);line(70,190,1010,190,fg);txt('0'+(scene+1)+' / 04',875,105,24,fg);let words=[['THE WORLD','MOVES FAST'],['REDUCE','THE NOISE'],['INCREASE','YOUR FOCUS'],['FIND YOUR','RHYTHM']][scene];g.save();g.beginPath();g.rect(65,1240,950,340);g.clip();words.forEach((s,i)=>txt(s,70,1380+i*120,110,fg,700));g.restore();line(70,1640,1010,1640,fg);txt('LITERATURE. MOVEMENT. ATTENTION.',70,1710,24,fg);txt('kin-txt.com',70,1800,46,fg,600);for(let i=0;i<30;i++){g.fillStyle=fg;g.globalAlpha=i<=k?1:.2;g.fillRect(70+i*31.3,1850,23,5)}g.globalAlpha=1}
const reader=document.querySelector('#reader');let ready=false,mode='',demoActive=false,finished=false;const url='/motion-reader.html?article=how-to-concentrate-on-reading&mode=word&motionDemo=1';function send(s){window.dispatchEvent(new CustomEvent('kin-motion-command',{detail:s}))}function resetDemo(){ready=false;mode='';demoActive=false;finished=false;reader.style.visibility='hidden';window.dispatchEvent(new Event('kin-motion-reset'))}window.addEventListener('kin-motion-status',e=>{const data=e.detail;{if(data==='kin-demo-ready'){ready=true;if(demoActive)reader.style.visibility='visible';if(demoActive&&!paused)send('kin-demo-play')}if(data==='kin-demo-page-started')mode='page';if(data==='kin-demo-finished')finished=true;}});resetDemo();function frame(now){let t=(paused?hold:now-start)/1000;if(t<12){if(demoActive)resetDemo();draw(t)}else{draw(11.99);g.fillStyle='#000';g.fillRect(0,0,1080,1920);g.fillStyle='#fff';txt('KiN-TXT',70,105,38,'#fff',700);txt('STUDIES IN ATTENTION',70,155,23,'#fff');line(70,190,1010,190,'#fff');line(70,1190,1010,1190,'#fff');txt('FIND YOUR',70,1380,110,'#fff',700);txt('RHYTHM',70,1500,110,'#fff',700);line(70,1640,1010,1640,'#fff');txt('LITERATURE. MOVEMENT. ATTENTION.',70,1710,24,'#fff');txt('kin-txt.com',70,1800,46,'#fff',600);txt(mode==='page'?'PAGE MODE':'WORD MODE',790,155,23,'#fff');if(!demoActive){demoActive=true;if(ready)reader.style.visibility='visible';if(ready&&!paused)send('kin-demo-play')}}requestAnimationFrame(frame)}requestAnimationFrame(frame);document.querySelector('#pause').onclick=e=>{if(paused){start=performance.now()-hold;paused=false}else{hold=performance.now()-start;paused=true}if(demoActive&&!finished)send(paused?'kin-demo-pause':'kin-demo-play');e.target.textContent=paused?'Play':'Pause'};document.querySelector('#restart').onclick=()=>{start=performance.now();hold=0;resetDemo()};document.querySelector('#hide').onclick=()=>document.body.classList.add('clean');c.onclick=()=>document.body.classList.remove('clean');
</script><script type="module" src="/src/motion-reader.tsx"></script></body></html>
